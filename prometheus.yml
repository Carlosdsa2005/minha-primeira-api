global:
  scrape_interval: 5s # O Prometheus vai bater na API e ler as métricas a cada 5 segundos

scrape_configs:
  - job_name: 'minha-api-spring-boot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-spring-boot:8080'] # O nome exato do nosso contêiner da API na rede do Docker!