version: '3.8'

services:
  # Contêiner 1: Nosso Banco de Dados PostgreSQL
  postgres-db:
    image: postgres:15
    container_name: minha_api_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: minha_api_db
    ports:
      - "5433:5432"

  # Contêiner 2: Nosso Cache em Memória (NOVO!)
  redis-cache:
    image: redis:7-alpine
    container_name: minha_api_redis
    ports:
      - "6379:6379"

  # Contêiner 3: A Nossa API
  api-spring-boot:
    build: .
    container_name: minha-api-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db
      - redis-cache # <-- NOVO: A API agora também espera o Redis ligar
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/minha_api_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123
      # <-- NOVO: Informamos ao Spring onde encontrar o Redis na rede do Docker
      SPRING_DATA_REDIS_HOST: redis-cache
      SPRING_DATA_REDIS_PORT: 6379