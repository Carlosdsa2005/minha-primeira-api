# A mágica do Hibernate: ele criará e atualizará a tabela de produtos automaticamente!
spring.jpa.hibernate.ddl-auto=update
# Exibe no terminal os comandos SQL que o Hibernate criar por trás dos panos
spring.jpa.show-sql=true
Passo 3: Mapear a Classe (@Entity) Agora vamos avisar ao Java que o nosso Produto é uma tabela de banco de dados. Abra a sua classe Produto.java e substitua todo o código por este abaixo. Note que adicionamos um ID (que é o identificador único obrigatório para bancos relacionais)
:
package com.seunome.minhaprimeiraapi; // Mantenha o seu pacote original!

import jakarta.persistence.Entity;
import jakarta.persistence.GeneratedValue;
import jakarta.persistence.GenerationType;
import jakarta.persistence.Id;

@Entity // Avisa ao Hibernate que esta classe deve virar uma tabela no PostgreSQL
public class Produto {

@Id // Define a Chave Primária (identificador único)
@GeneratedValue(strategy = GenerationType.IDENTITY) // O banco vai gerar os números sozinho (1, 2, 3...)
private Long id;

private String nome;
private double preco;

// O JPA exige obrigatoriamente um construtor vazio
public Produto() {
}

public Produto(String nome, double preco) {
this.nome = nome;
this.preco = preco;
}

// Getters
public Long getId() {
return id;
}

public String getNome() {
return nome;
}

public double getPreco() {
return preco;
}
}