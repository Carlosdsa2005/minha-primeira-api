spring.application.name=minhaprimeriaAPI

spring.datasource.url=jdbc:postgresql://postgres-db:5432/minha_api_db
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Expõe os endpoints de saúde da API e a rota de métricas do Prometheus
management.endpoints.web.exposure.include=health,info,prometheus

# Habilita a coleta específica de dados para o Prometheus
management.endpoint.prometheus.enabled=true

# "Carimba" esse nome em todas as métricas enviadas para o Prometheus/Grafana
management.metrics.tags.application=${spring.application.name}